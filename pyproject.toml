[project]
name = "ai-travel-planner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn==0.54.0",
    "openai-agents==0.24.0",
    "openai==3.41.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "duckduckgo_search==8.1.1",
    "fpdf2==2.8.9",
]

[tool.vercel]
entrypoint = "server:app"

[tool.vercel.fastapi.static]
cdn = true